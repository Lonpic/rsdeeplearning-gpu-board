<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f7f7"><title>课题组显卡占用</title>
<style>
:root{color-scheme:light;font-family:Arial,"Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0;background:#f5f7f7;color:#1c3032}button,input{font:inherit}button{cursor:pointer}
.topbar{height:70px;padding:0 max(22px,calc((100vw - 1160px)/2));display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid #e4eaea}.mark{width:35px;height:35px;border-radius:11px;display:flex;align-items:end;justify-content:center;gap:3px;padding-bottom:9px;background:#176b63}.mark i{width:4px;border-radius:3px;background:#fff}.mark i:nth-child(1){height:8px;opacity:.6}.mark i:nth-child(2){height:15px}.mark i:nth-child(3){height:11px;opacity:.8}.brand{display:flex;flex-direction:column;line-height:1.25}.brand strong{font-size:15px}.brand small{font-size:11px;color:#829092;margin-top:3px}.top-tag{margin-left:auto;border:1px solid #d9e7e3;color:#176b63;background:#f2faf7;padding:5px 10px;border-radius:99px;font-size:12px}
.content{max-width:1208px;margin:auto;padding:20px 24px 34px}.toolbar{display:flex;justify-content:flex-end;margin-bottom:16px}.refresh{border:1px solid #dbe5e4;background:white;color:#466264;border-radius:11px;padding:10px 15px;white-space:nowrap;font-size:13px;font-weight:700}.refresh:hover{background:#edf6f2}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.server{min-width:0;border:1px solid #e1e8e8;border-radius:17px;background:#fff;box-shadow:0 9px 30px rgba(36,65,64,.035);overflow:hidden}.server-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:23px 24px 18px}.server-head h2{margin:0;font-size:20px;letter-spacing:-.035em}.server-head p{margin:5px 0 0;color:#8a9899;font-size:12px}.pill{flex:none;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;font-size:11px;font-weight:700}.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.pill.live{color:#148066;background:#e9f8f0}.pill.unknown{color:#a47019;background:#fff5df}
.gpu-list{border-top:1px solid #edf1f0}.gpu-row{display:grid;grid-template-columns:83px 1fr;min-height:67px;border-bottom:1px solid #edf1f0}.gpu-index{display:flex;align-items:baseline;gap:5px;padding:21px 0 18px 24px;color:#899a9a;font-size:11px}.gpu-index strong{color:#3d5a5b;font-size:17px}.gpu-usage{display:flex;flex-direction:column;justify-content:center;gap:8px;padding:15px 22px 15px 10px}.person{display:flex;justify-content:space-between;align-items:baseline;gap:10px;min-width:0}.person strong{font-size:14px;color:#203c3d;overflow-wrap:anywhere}.person time{color:#748a89;font-size:12px;white-space:nowrap}.idle,.unknown-text{color:#9aabab;font-size:13px}.unknown-text{color:#a58d64}.server-foot{padding:13px 24px;color:#9aa8a8;font-size:11px}.foot{padding:25px 2px;text-align:center;color:#9ba9a9;font-size:12px}
.center{max-width:430px;margin:11vh auto 0;padding:32px;border:1px solid #e1e8e8;border-radius:18px;background:#fff;box-shadow:0 12px 45px rgba(36,65,64,.05);text-align:center;color:#829092;font-size:13px}
[hidden]{display:none!important}@media(max-width:760px){.topbar{height:64px;padding:0 18px}.content{padding:16px 14px}.toolbar{margin-bottom:13px}.grid{grid-template-columns:1fr;gap:13px}.server-head{padding:20px 19px 16px}.gpu-index{padding-left:19px}.gpu-usage{padding-right:18px}.server-foot{padding-left:19px}}
</style></head><body>
<header class="topbar"><div class="mark" aria-hidden="true"><i></i><i></i><i></i></div><div class="brand"><strong>GPU 使用看板</strong><small>课题组 · 实时占用</small></div><span class="top-tag">只读</span></header>
<section class="center" id="loading">正在连接看板…</section>
<main class="content" id="dashboard" hidden><div class="toolbar"><button class="refresh" id="refresh" type="button">↻ 刷新</button></div><section class="grid" id="grid" aria-label="服务器显卡占用"></section><footer class="foot">GitHub 数据可能延迟约 5 分钟 · 以服务器底部更新时间为准</footer></main>
<script>
const hosts=[{id:'a100',label:'A100',count:2},{id:'rtx4090',label:'RTX4090',count:5},{id:'v100-1',label:'V100 · 1',count:2},{id:'v100-2',label:'V100 · 2',count:2}];
const formatter=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
const show=(id,value)=>{document.getElementById(id).hidden=!value};
const node=(tag,cls,value)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(value!==undefined)e.textContent=value;return e};
function render(snapshots){const map=new Map(snapshots.map(s=>[s.host,s]));const grid=document.getElementById('grid');grid.replaceChildren();const now=Date.now();for(const host of hosts){const snap=map.get(host.id);const age=snap?now-snap.received_at:Infinity;const delayed=age>120000;const unavailable=!snap||age>420000||snap.error||!snap.gpus;const card=node('article','server');const head=node('div','server-head');const label=node('div');label.append(node('h2','',host.label),node('p','',host.count+' 张显卡'));const pill=node('span','pill '+(unavailable||delayed?'unknown':'live'),unavailable?'状态未知':delayed?'缓存数据':'已更新');head.append(label,pill);card.append(head);const list=node('div','gpu-list');const gpuMap=new Map((snap&&snap.gpus||[]).map(g=>[g.index,g]));for(let i=0;i<host.count;i++){const row=node('div','gpu-row');const number=node('div','gpu-index');number.append(node('span','', 'GPU'),node('strong','',String(i)));const usage=node('div','gpu-usage');const gpu=gpuMap.get(i);if(unavailable||!gpu){usage.append(node('span','unknown-text','状态未知'))}else if(!gpu.occupants.length){usage.append(node('span',delayed?'unknown-text':'idle',delayed?'缓存时空闲 · 当前未知':'空闲'))}else{for(const person of gpu.occupants){const line=node('div','person');const date=node('time','',formatter.format(new Date(person.started_at))+' 开始');date.dateTime=new Date(person.started_at).toISOString();line.append(node('strong','',person.user),date);usage.append(line)}}row.append(number,usage);list.append(row)}card.append(list,node('div','server-foot',snap?'最近更新 '+formatter.format(new Date(snap.received_at))+(snap.error?' · 读取异常':''):'等待服务器首次上报'));grid.append(card)}}

const rawUrl='https://raw.githubusercontent.com/Lonpic/rsdeeplearning-gpu-board/data/status.json';
const apiUrl='https://api.github.com/repos/Lonpic/rsdeeplearning-gpu-board/contents/status.json?ref=data';
let apiData=null,apiLastAttempt=0;
async function refresh(){
  let rawData={hosts:[]};
  try{const response=await fetch(rawUrl,{cache:'no-store'});if(response.ok)rawData=await response.json()}catch{}
  const rawAge=Date.now()-Math.max(0,...(rawData.hosts||[]).map(s=>s.received_at||0));
  if(rawAge>90000&&Date.now()-apiLastAttempt>120000){
    apiLastAttempt=Date.now();
    try{
      const response=await fetch(apiUrl,{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});
      if(response.ok){
        const file=await response.json();
        const bytes=Uint8Array.from(atob(file.content.replace(/\s/g,'')),c=>c.charCodeAt(0));
        const parsed=JSON.parse(new TextDecoder().decode(bytes));
        if(Array.isArray(parsed.hosts))apiData=parsed;
      }
    }catch{}
  }
  const merged=new Map((rawData.hosts||[]).map(s=>[s.host,s]));
  for(const snap of apiData?.hosts||[])if((merged.get(snap.host)?.received_at||0)<snap.received_at)merged.set(snap.host,snap);
  render([...merged.values()]);
  show('loading',false);show('dashboard',true);
}
document.getElementById('refresh').addEventListener('click',refresh);refresh();setInterval(refresh,30000);
</script></body></html>
